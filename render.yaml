services:
  # A separate service from main's sensocrypt-v2-backend -- deliberately isolated so the
  # in-progress voice-detection branch can never touch the working production backend main
  # relies on. Deploy this by pointing a NEW Render Blueprint instance at the
  # voice-detection branch specifically (not by re-running the existing production
  # blueprint), so Render creates it as its own resource rather than trying to reconcile it
  # against the production one of the same name.
  #
  # No `databases:` block here -- Render's free tier allows only one free Postgres per
  # account, and main's sensocrypt-v2-db already uses it. DATABASE_URL below is set
  # manually instead, pointed at a free external Postgres (e.g. a Neon.tech free-tier
  # project) so this test service still never touches production data.
  - type: web
    name: sensocrypt-v2-backend-voicedetect
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PASETO_LOCAL_KEY_HEX
        sync: false
      - key: ANDROID_PACKAGE
        value: com.sensocrypt.v2
      - key: PINNED_SIGNING_CERT_DIGESTS_HEX
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Points at the separate Cloud Run inference service (voice-service/), not deployed
      # through this repo -- see voice-service/README.md for its own deploy command.
      - key: VOICE_SERVICE_URL
        sync: false
      - key: VOICE_SERVICE_API_KEY
        sync: false
